name: Create Release on Version Bump

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only proceed when extVersionCode in the Kavita build.gradle actually increased.
      - name: Detect extVersionCode bump
        id: version_check
        run: |
          set -euo pipefail
          GRADLE="src/all/kavita/build.gradle"
          if [ ! -f "$GRADLE" ]; then
            echo "❌ $GRADLE not found"
            exit 1
          fi

          CURRENT=$(grep -E '^\s*extVersionCode\s*=' "$GRADLE" | head -1 | grep -oE '[0-9]+' || true)
          if [ -z "$CURRENT" ]; then
            echo "❌ Could not read extVersionCode from $GRADLE"
            exit 1
          fi
          echo "current_code=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current extVersionCode = $CURRENT"

          # Previous value on the parent of this push (or HEAD~1 for workflow_dispatch)
          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi

          PREV=""
          if [ -n "$BEFORE_SHA" ] && git cat-file -e "${BEFORE_SHA}:${GRADLE}" 2>/dev/null; then
            PREV=$(git show "${BEFORE_SHA}:${GRADLE}" | grep -E '^\s*extVersionCode\s*=' | head -1 | grep -oE '[0-9]+' || true)
          fi

          if [ -z "$PREV" ]; then
            # Fallback: look at the most recent tag / previous bump commit
            PREV=$(git log -1 --pretty=%H -- "$GRADLE" | xargs -I{} git show {}:"$GRADLE" 2>/dev/null | grep -E '^\s*extVersionCode\s*=' | head -1 | grep -oE '[0-9]+' || true)
          fi

          echo "previous_code=${PREV:-none}" >> "$GITHUB_OUTPUT"
          echo "Previous extVersionCode = ${PREV:-<unknown>}"

          if [ -n "$PREV" ] && [ "$CURRENT" -le "$PREV" ]; then
            echo "⏭️  extVersionCode did not increase ($PREV → $CURRENT). Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ extVersionCode bumped (${PREV:-?} → $CURRENT). Will create release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo branch (APKs live here)
        if: steps.version_check.outputs.should_release == 'true'
        uses: actions/checkout@v4
        with:
          ref: repo
          fetch-depth: 0
          path: repo-branch

      - name: Find APK and extract version
        if: steps.version_check.outputs.should_release == 'true'
        id: apk_info
        run: |
          set -euo pipefail
          APK_PATH=$(find repo-branch/apk -name "tachiyomi-all.kavita-*.apk" -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$APK_PATH" ]; then
            # Also try the root of the repo branch layout used by some forks
            APK_PATH=$(find repo-branch -name "tachiyomi-all.kavita-*.apk" -type f 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "❌ No Kavita APK found under repo-branch/"
            ls -laR repo-branch || true
            exit 1
          fi

          APK_FILENAME=$(basename "$APK_PATH")
          VERSION=$(echo "$APK_FILENAME" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$VERSION" ]; then
            echo "❌ Could not parse version from: $APK_FILENAME"
            exit 1
          fi

          echo "Found APK: $APK_PATH"
          echo "Detected version tag: $VERSION"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        if: steps.version_check.outputs.should_release == 'true'
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.apk_info.outputs.version }}"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "⚠️  Release $VERSION already exists — skipping creation."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Release $VERSION does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Collect bodies of every PR merged since the previous version tag
      # (or since the last extVersionCode-changing commit). Strip the PR checklist.
      - name: Build release notes from all PRs since last bump
        if: steps.version_check.outputs.should_release == 'true' && steps.check_release.outputs.exists == 'false'
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # We are still on the default branch checkout from the first step.
          # Find the previous version tag (v1.4.x).
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            # Fallback: commit that last changed extVersionCode
            LAST_TAG=$(git log -2 --pretty=%H -- src/all/kavita/build.gradle | tail -1)
          fi
          echo "Range start: ${LAST_TAG:-beginning}"

          # Collect merge commits / PR numbers in the range
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="HEAD~30..HEAD"
          fi

          PR_NUMBERS=$(
            git log $RANGE --merges --pretty=%B 2>/dev/null \
              | grep -oE 'Merge pull request #[0-9]+' \
              | grep -oE '[0-9]+' \
              | sort -n -u || true
          )
          # Also catch squash-merge style "Title (#123)"
          PR_NUMBERS_EXTRA=$(
            git log $RANGE --pretty=%s 2>/dev/null \
              | grep -oE '\(#[0-9]+\)' \
              | grep -oE '[0-9]+' \
              | sort -n -u || true
          )
          ALL_PRS=$(echo -e "${PR_NUMBERS}\n${PR_NUMBERS_EXTRA}" | grep -E '^[0-9]+$' | sort -n -u || true)

          echo "PRs found in range: $(echo $ALL_PRS | tr '\n' ' ')"

          NOTES=""
          for PR in $ALL_PRS; do
            echo "Fetching PR #$PR …"
            PR_JSON=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR")
            TITLE=$(echo "$PR_JSON" | jq -r '.title // empty')
            BODY=$(echo "$PR_JSON" | jq -r '.body // empty')
            AUTHOR=$(echo "$PR_JSON" | jq -r '.user.login // empty')
            if [ -z "$TITLE" ]; then
              echo "  (PR #$PR not found or inaccessible, skipping)"
              continue
            fi

            # Strip the standard checklist block and trailing noise
            CLEAN_BODY=$(echo "$BODY" | sed -E '
              /Checklist:/,/^$/d
              /^\s*\*\s*\[[ xX]\]/d
              /^\s*-\s*\[[ xX]\]/d
              /^This has been done using ai.*/Id
            ' | sed -E '/^[[:space:]]*$/d' | sed -E '1{/^$/d}')

            NOTES="${NOTES}### ${TITLE} (#${PR})
*by @${AUTHOR}*

${CLEAN_BODY}

---
"
          done

          if [ -z "$NOTES" ]; then
            NOTES="*(No linked PR bodies found for this bump; see commit log below.)*"
          fi

          {
            echo "body<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build commit log since last tag
        if: steps.version_check.outputs.should_release == 'true' && steps.check_release.outputs.exists == 'false'
        id: changelog
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" || true)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" -n 30 || true)
          fi
          {
            echo "changelog<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.version_check.outputs.should_release == 'true' && steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.apk_info.outputs.version }}
          tag_name: ${{ steps.apk_info.outputs.version }}
          # Tag points at the repo branch (where the APK lives) so the asset matches the published index.
          target_commitish: repo
          body: |
            ## 🚀 Release ${{ steps.apk_info.outputs.version }}

            ${{ steps.notes.outputs.body }}

            <details>
            <summary>📦 Full commit log since previous tag</summary>

            ${{ steps.changelog.outputs.changelog }}
            </details>

            ---
            🤖 *This release was automatically created on extVersionCode bump*
          files: ${{ steps.apk_info.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
